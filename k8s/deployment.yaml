apiVersion: apps/v1
kind: Deployment
metadata:
  name: punitxd-getting-started-app
  namespace: kairo-punitxd-getting-started-app
  labels:
    app: punitxd-getting-started-app
    app.kubernetes.io/managed-by: kairo
spec:
  replicas: 1
  # rollback needs old ReplicaSets to still be around
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: punitxd-getting-started-app
  template:
    metadata:
      labels:
        app: punitxd-getting-started-app
        app.kubernetes.io/managed-by: kairo
    spec:
      containers:
        - name: punitxd-getting-started-app
          image: kairo/punitxd-getting-started-app:6b025fc53bc7b9bef435d6b09bcd1da5a871c9cc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # liveness + memory limit are what make self-healing possible.
          # don't remove them without talking to BE 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
